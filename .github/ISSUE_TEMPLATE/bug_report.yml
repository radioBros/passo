name: Bug report
description: Something PASSO does that it should not
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** attach real invoices, PEC passwords, or API tokens.
        Vulnerabilities go to [SECURITY.md](https://github.com/radioBros/passo/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got (`error.code`, `requestId`).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options: [mock, pec, openapi, invoicetronic, unknown / none]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact secrets. Prefer `error.code` and `requestId`.
      render: text
